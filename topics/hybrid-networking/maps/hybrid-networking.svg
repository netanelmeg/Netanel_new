<svg id="map" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="clickable" data-node="hub-vnet">
    <rect x="30" y="30" width="320" height="210" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="50" y="54" fill="#0C447C">Hub VNet</text>
    <text class="ts" x="50" y="72" fill="#185FA5">10.0.0.0/16 · shared plumbing</text>
  </g>

  <g class="clickable" data-node="firewall">
    <rect x="55" y="90" width="120" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text class="th" x="115" y="108" text-anchor="middle" dominant-baseline="central" fill="#633806">Azure Firewall</text>
    <text class="ts" x="115" y="125" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Inspects all traffic</text>
  </g>

  <g class="clickable" data-node="vpn-gw">
    <rect x="190" y="90" width="140" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
    <text class="th" x="260" y="108" text-anchor="middle" dominant-baseline="central" fill="#72243E">VPN Gateway</text>
    <text class="ts" x="260" y="125" text-anchor="middle" dominant-baseline="central" fill="#993556">Builds the tunnel</text>
  </g>

  <g class="clickable" data-node="bgp">
    <rect x="105" y="158" width="140" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="th" x="175" y="176" text-anchor="middle" dominant-baseline="central" fill="#27500A">BGP</text>
    <text class="ts" x="175" y="193" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">Auto-learns routes</text>
  </g>

  <line class="arrow-line" data-arrow="vpngw-uses-bgp" x1="245" y1="134" x2="200" y2="158" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="ts arrow-label" data-label="vpngw-uses-bgp" x="252" y="155" fill="#444441">uses</text>

  <g class="clickable" data-node="lng">
    <rect x="400" y="40" width="250" height="100" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text class="th" x="525" y="62" text-anchor="middle" dominant-baseline="central" fill="#712B13">Local Network Gateway</text>
    <text class="ts" x="525" y="84" text-anchor="middle" dominant-baseline="central" fill="#993C1D">On-prem public IP</text>
    <text class="ts" x="525" y="102" text-anchor="middle" dominant-baseline="central" fill="#993C1D">+ ranges (manual)</text>
    <text class="ts" x="525" y="120" text-anchor="middle" dominant-baseline="central" fill="#993C1D">or BGP peer (auto)</text>
  </g>

  <g class="clickable" data-node="on-prem">
    <rect x="400" y="180" width="250" height="230" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="th" x="420" y="202" fill="#2C2C2A">On-premises</text>
    <text class="ts" x="420" y="220" fill="#5F5E5A">192.168.0.0/16</text>
  </g>

  <g class="clickable" data-node="onprem-router">
    <rect x="420" y="240" width="210" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
    <text class="th" x="525" y="258" text-anchor="middle" dominant-baseline="central" fill="#72243E">On-prem router</text>
    <text class="ts" x="525" y="275" text-anchor="middle" dominant-baseline="central" fill="#993556">Tunnel endpoint · BGP peer</text>
  </g>

  <g class="clickable" data-node="onprem-dns">
    <rect x="420" y="320" width="210" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="th" x="525" y="340" text-anchor="middle" dominant-baseline="central" fill="#3C3489">On-prem DNS</text>
    <text class="ts" x="525" y="358" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Owns *.corp.local</text>
    <text class="ts" x="525" y="373" text-anchor="middle" dominant-baseline="central" fill="#534AB7">conditional forwarder set</text>
  </g>

  <line class="arrow-line" data-arrow="lng-represents-onprem" x1="525" y1="142" x2="525" y2="178" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="ts arrow-label" data-label="lng-represents-onprem" x="532" y="163" fill="#444441">represents</text>

  <line class="arrow-line" data-arrow="tunnel" x1="330" y1="105" x2="418" y2="258" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="6 4"/>
  <text class="ts arrow-label" data-label="tunnel" x="335" y="180" fill="#444441">S2S tunnel</text>
  <text class="ts arrow-label" data-label="tunnel" x="335" y="195" fill="#27500A">(BGP routes)</text>

  <g class="clickable" data-node="spoke-a">
    <rect x="30" y="270" width="170" height="140" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="115" y="294" text-anchor="middle" dominant-baseline="central" fill="#085041">Spoke-A (Prod)</text>
    <text class="ts" x="115" y="312" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">10.1.0.0/16</text>
    <rect x="45" y="330" width="140" height="64" rx="6" fill="#fff" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="3 3"/>
    <text class="ts" x="115" y="347" text-anchor="middle" dominant-baseline="central" fill="#085041" font-weight="500">Route Table</text>
    <text class="ts" x="115" y="363" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">dest 10.2.0.0/16</text>
    <text class="ts" x="115" y="378" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">next hop → Hub FW</text>
  </g>

  <g class="clickable" data-node="spoke-b">
    <rect x="220" y="270" width="170" height="140" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="305" y="294" text-anchor="middle" dominant-baseline="central" fill="#085041">Spoke-B (Dev)</text>
    <text class="ts" x="305" y="312" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">10.2.0.0/16</text>
    <rect x="235" y="330" width="140" height="64" rx="6" fill="#fff" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="3 3"/>
    <text class="ts" x="305" y="347" text-anchor="middle" dominant-baseline="central" fill="#085041" font-weight="500">Route Table</text>
    <text class="ts" x="305" y="363" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">dest 10.1.0.0/16</text>
    <text class="ts" x="305" y="378" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">next hop → Hub FW</text>
  </g>

  <line class="arrow-line" data-arrow="spoke-a-peers" x1="115" y1="270" x2="115" y2="242" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="ts arrow-label" data-label="spoke-a-peers" x="120" y="258" fill="#444441">peers</text>

  <line class="arrow-line" data-arrow="spoke-b-peers" x1="305" y1="270" x2="305" y2="242" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="ts arrow-label" data-label="spoke-b-peers" x="310" y="258" fill="#444441">peers</text>

  <g class="clickable" data-node="dns-zone">
    <rect x="30" y="460" width="620" height="80" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="th" x="340" y="484" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Private DNS Zone — corp.local</text>
    <text class="ts" x="340" y="504" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Standalone resource · linked to Hub + Spoke-A + Spoke-B</text>
    <text class="ts" x="340" y="522" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Conditional forwarder ↔ on-prem DNS server</text>
  </g>

  <line class="arrow-line" data-arrow="spoke-a-dns-link" x1="115" y1="410" x2="115" y2="458" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="ts arrow-label" data-label="spoke-a-dns-link" x="120" y="437" fill="#444441">links</text>

  <line class="arrow-line" data-arrow="spoke-b-dns-link" x1="305" y1="410" x2="305" y2="458" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="ts arrow-label" data-label="spoke-b-dns-link" x="310" y="437" fill="#444441">links</text>

  <line class="arrow-line" data-arrow="hub-dns-link" x1="210" y1="240" x2="210" y2="458" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="ts arrow-label" data-label="hub-dns-link" x="186" y="437" fill="#444441" text-anchor="end">links</text>

  <line class="arrow-line" data-arrow="dns-forward" x1="525" y1="382" x2="525" y2="458" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="6 4"/>
  <text class="ts arrow-label" data-label="dns-forward" x="532" y="422" fill="#3C3489">DNS forwarding</text>

</svg>
