[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdconvert"
version = "0.1.0"
description = "Convert PDF, Excel, CSV, Word, PowerPoint, JSON, HTML and text files to Markdown."
readme = "mdconvert/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# The engine + text/CSV/TSV/JSON/HTML converters need nothing extra.
# Install format extras as needed (see optional-dependencies below).
dependencies = []

[project.optional-dependencies]
office = ["openpyxl>=3.1.0", "python-docx>=1.1.0", "python-pptx>=0.6.23"]
pdf = ["pdfplumber>=0.11.0"]
html = ["markdownify>=0.11.6"]
telegram = ["python-telegram-bot>=20.0"]
all = [
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "markdownify>=0.11.6",
    "chardet>=5.2.0",
    "python-telegram-bot>=20.0",
]

# Exposes a `mdconvert` command on PATH after `pip install -e .`
[project.scripts]
mdconvert = "mdconvert.cli:run"

[tool.setuptools]
packages = ["mdconvert"]
